# Receipts awaiting review for Bühnefrei e.V. (organization 4, user alice), each covering a case worth trying in the
# review and split drawers. Most have a bank movement on the test account with the same amount, so confirming and
# linking can be tried end to end. Like the other seeded receipts they carry no file (no preview).
# Bommels of the organization: 24 Kiosk, 25 Räumlichkeiten, 26 Workshops, 27 Projekte with the productions
# 28 Der kleine Lord, 29 Das Hässliche Entlein, 30 König der Löwen.
#
# Split scenarios (211-216): each comes twice, once open to try the split and the bank linking by hand (211, 213, 215)
# and once already split into draft parts and linked as a reference (212, 214, 216, confirmed receipts).
