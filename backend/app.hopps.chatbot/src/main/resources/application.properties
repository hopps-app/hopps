########################################
# General
########################################
%dev.quarkus.http.port=8104
%prod.quarkus.management.enabled=true
quarkus.banner.path=banner.txt

########################################
# WhatsApp Cloud API (Meta)
########################################
# Meta calls GET /webhooks/whatsapp once with this token when the webhook is registered
# in the Meta App Dashboard (WhatsApp > Configuration).
hopps.chatbot.whatsapp.verify-token=${HOPPS_WHATSAPP_VERIFY_TOKEN}
# App secret of the Meta app. Every webhook POST is signed with it (X-Hub-Signature-256).
hopps.chatbot.whatsapp.app-secret=${HOPPS_WHATSAPP_APP_SECRET}
# Permanent token of a system user with the whatsapp_business_messaging permission.
hopps.chatbot.whatsapp.access-token=${HOPPS_WHATSAPP_ACCESS_TOKEN}
# ID of the WhatsApp business phone number that sends the replies (not the phone number itself).
hopps.chatbot.whatsapp.phone-number-id=${HOPPS_WHATSAPP_PHONE_NUMBER_ID}
hopps.chatbot.whatsapp.graph-api-version=${HOPPS_WHATSAPP_GRAPH_API_VERSION:v21.0}

quarkus.rest-client.whatsapp-graph.url=${HOPPS_WHATSAPP_GRAPH_URL:https://graph.facebook.com}
quarkus.rest-client.whatsapp-graph.connect-timeout=5000
quarkus.rest-client.whatsapp-graph.read-timeout=30000

# Placeholders so dev mode and tests start without a Meta app.
%dev,test.hopps.chatbot.whatsapp.verify-token=${HOPPS_WHATSAPP_VERIFY_TOKEN:dev-verify-token}
%dev,test.hopps.chatbot.whatsapp.app-secret=${HOPPS_WHATSAPP_APP_SECRET:dev-app-secret}
%dev,test.hopps.chatbot.whatsapp.access-token=${HOPPS_WHATSAPP_ACCESS_TOKEN:dev-access-token}
%dev,test.hopps.chatbot.whatsapp.phone-number-id=${HOPPS_WHATSAPP_PHONE_NUMBER_ID:000000000000000}

########################################
# Azure OpenAI / LangChain4j
########################################
# GDPR: same setup as zugferd and az-document-ai - our own Azure OpenAI resource in West Europe, deployed as
# DataZoneStandard so inference stays inside the EU data zone. The model is selected via the deployment name.
quarkus.langchain4j.azure-openai.resource-name=${HOPPS_AZURE_OPENAI_RESOURCE_NAME}
quarkus.langchain4j.azure-openai.deployment-name=${HOPPS_AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4o-mini}
quarkus.langchain4j.azure-openai.api-key=${HOPPS_AZURE_OPENAI_KEY}
quarkus.langchain4j.azure-openai.api-version=${HOPPS_AZURE_OPENAI_API_VERSION:2024-10-21}
quarkus.langchain4j.azure-openai.timeout=${HOPPS_AZURE_OPENAI_TIMEOUT:30s}
# Low temperature: answers about Hopps should be consistent, not creative.
quarkus.langchain4j.azure-openai.chat-model.temperature=0.3
# Chat memory per conversation: the last N messages are sent along with each request.
# Kept in memory only, so it is lost on restart.
quarkus.langchain4j.chat-memory.memory-window.max-messages=20
%dev.quarkus.langchain4j.azure-openai.log-requests=true
%dev.quarkus.langchain4j.azure-openai.log-responses=true

# Placeholders so dev mode and tests start without Azure credentials. Real answers in dev need the env vars.
%test,dev.quarkus.langchain4j.azure-openai.resource-name=${HOPPS_AZURE_OPENAI_RESOURCE_NAME:hopps-openai}
%test,dev.quarkus.langchain4j.azure-openai.api-key=${HOPPS_AZURE_OPENAI_KEY:some-azure-openai-key}
