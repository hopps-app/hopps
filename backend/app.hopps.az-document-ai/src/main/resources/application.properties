########################################
# General
########################################
%dev.quarkus.http.port=8100
%prod.quarkus.management.enabled=true
quarkus.banner.path=banner.txt

# HTTP configuration
quarkus.http.root-path=/api/az-document-ai
# Max accepted document size, kept in sync with the frontend upload validation and the org service's default.
# Azure's S0 (Standard) tier accepts up to 500 MB per document, so this is our own policy limit, not an Azure
# one. On the F0 (Free) tier Azure caps documents at 4 MB — lower this back to 4M if ever switching to F0.
quarkus.http.limits.max-body-size=10M

########################################
# Azure Document Intelligence
########################################
app.hopps.az-document-ai.azure.endpoint=${HOPPS_AZURE_DOCUMENT_AI_ENDPOINT}
app.hopps.az-document-ai.azure.key=${HOPPS_AZURE_DOCUMENT_AI_KEY}
app.hopps.az-document-ai.azure.modelId=prebuilt-invoice

# Test configuration
%test,dev.app.hopps.az-document-ai.azure.endpoint=${HOPPS_AZURE_DOCUMENT_AI_ENDPOINT:https://hopps-document-ai.cognitiveservices.azure.com}
%test,dev.app.hopps.az-document-ai.azure.key=${HOPPS_AZURE_DOCUMENT_AI_KEY:some-azure-document-ai-key}

########################################
# Azure OpenAI / LangChain4j
########################################
# GDPR: inference runs through our own Azure OpenAI resource in West Europe,
# deployed as DataZoneStandard so both storage and inference stay inside the EU
# data zone - never through api.openai.com in the US. The model is not selected
# via model-name but via the name of the Azure deployment.
quarkus.langchain4j.azure-openai.resource-name=${HOPPS_AZURE_OPENAI_RESOURCE_NAME}
quarkus.langchain4j.azure-openai.deployment-name=${HOPPS_AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4o-mini}
quarkus.langchain4j.azure-openai.api-key=${HOPPS_AZURE_OPENAI_KEY}
# The extension defaults to 2024-10-21; override if Azure requires a newer one.
quarkus.langchain4j.azure-openai.api-version=${HOPPS_AZURE_OPENAI_API_VERSION:2024-10-21}

# Test configuration: placeholders so builds start without Azure credentials.
# Tag generation then fails and degrades to an empty tag list.
%test,dev.quarkus.langchain4j.azure-openai.resource-name=${HOPPS_AZURE_OPENAI_RESOURCE_NAME:hopps-openai}
%test,dev.quarkus.langchain4j.azure-openai.api-key=${HOPPS_AZURE_OPENAI_KEY:some-azure-openai-key}

########################################
# Logging
########################################
quarkus.log.category."org.jboss.resteasy.reactive.server.handlers.ParameterHandler".level=DEBUG
