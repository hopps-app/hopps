{{- if eq .Values.org.storage.type "local" }}
{{- $multiReplica := or (gt (int .Values.org.replicaCount) 1) .Values.org.autoscaling.enabled }}
{{- $sharedVolume := has "ReadWriteMany" .Values.org.storage.local.persistence.accessModes }}
{{- if and $multiReplica (not $sharedVolume) }}
{{- fail "org.storage.type=local stores files in a directory that is not shared between pods. Keep org.replicaCount at 1 with autoscaling disabled, or use a ReadWriteMany volume in org.storage.local.persistence.accessModes." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hopps.orgFullname" . }}
  labels:
    {{- include "hopps.orgLabels" . | nindent 4 }}
spec:
  {{- if not .Values.org.autoscaling.enabled }}
  replicas: {{ .Values.org.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hopps.orgSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.org.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hopps.orgSelectorLabels" . | nindent 8 }}
        {{- with .Values.org.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if or .Values.global.imagePullSecrets .Values.org.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
        {{- toYaml .Values.org.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.org.serviceAccount.create }}
      serviceAccountName: {{ .Values.org.serviceAccount.name | default (include "hopps.orgFullname" .) }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.org.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          env:
            {{- if .Values.org.envVars }}
            {{- toYaml .Values.org.envVars | nindent 12 }}
            {{- end }}
            # az-document-ai
            - name: HOPPS_DOCUMENT_AI_SERVICE_URL
              value: http://{{ .Release.Name }}-az-document-ai:{{ .Values.azDocumentAi.service.port }}
            # zugferd
            - name: HOPPS_ZUGFERD_SERVICE_URL
              value: http://{{ .Release.Name }}-zugferd:{{ .Values.zugferd.service.port }}
            # file storage
            - name: HOPPS_STORAGE_TYPE
              value: {{ .Values.org.storage.type | quote }}
            {{- if eq .Values.org.storage.type "local" }}
            - name: HOPPS_STORAGE_LOCAL_ROOT
              value: {{ .Values.org.storage.local.mountPath | quote }}
            {{- end }}

          securityContext:
            {{- toYaml .Values.org.securityContext | nindent 12 }}
          image: "{{ .Values.org.image.repository }}:{{ .Values.org.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.org.image.pullPolicy }}
          {{- with .Values.org.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.org.service.port }}
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.org.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.org.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.org.resources | nindent 12 }}
          {{- $localStorage := eq .Values.org.storage.type "local" }}
          {{- if or .Values.org.volumeMounts $localStorage }}
          volumeMounts:
            {{- with .Values.org.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $localStorage }}
            - name: file-storage
              mountPath: {{ .Values.org.storage.local.mountPath }}
            {{- end }}
          {{- end }}
      {{- $localStorage := eq .Values.org.storage.type "local" }}
      {{- if or .Values.org.volumes $localStorage }}
      volumes:
        {{- with .Values.org.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $localStorage }}
        - name: file-storage
          {{- if .Values.org.storage.local.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.org.storage.local.persistence.existingClaim | default (printf "%s-storage" (include "hopps.orgFullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.org.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.org.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.org.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}