{{- if .Values.mailDev.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hopps.roundcubeFullname" . }}
  labels:
    {{- include "hopps.roundcubeLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hopps.roundcubeSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hopps.roundcubeSelectorLabels" . | nindent 8 }}
    spec:
      # Runs fully non-root (uid/gid 33 = www-data). The stock roundcube apache
      # image assumes root, so we work around its two root-only steps:
      #  - Apache listens on unprivileged 8080 instead of 80 (a non-root process
      #    cannot bind :80; NET_BIND_SERVICE via securityContext does NOT help
      #    because Kubernetes sets no ambient caps, so the cap is dropped when the
      #    entrypoint execs apache). Port override comes from the ConfigMap below.
      #  - The SQLite dir (/var/roundcube) and Apache's log dir (/var/log/apache2)
      #    are root-owned in the image, so we mount writable emptyDirs there;
      #    fsGroup 33 makes them group-writable for www-data.
      # The Service still exposes port 80 -> targetPort "http" (8080), so the
      # Ingress is unaffected. Dev-only mail catcher; SQLite state is ephemeral.
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roundcube
          image: "{{ .Values.mailDev.roundcube.image.repository }}:{{ .Values.mailDev.roundcube.image.tag }}"
          imagePullPolicy: {{ .Values.mailDev.roundcube.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ROUNDCUBEMAIL_DEFAULT_HOST
              value: {{ include "hopps.greenmailFullname" . }}
            - name: ROUNDCUBEMAIL_DEFAULT_PORT
              value: "3143"
            - name: ROUNDCUBEMAIL_SMTP_SERVER
              value: {{ include "hopps.greenmailFullname" . }}
            - name: ROUNDCUBEMAIL_SMTP_PORT
              value: "3025"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: apache-config
              mountPath: /etc/apache2/ports.conf
              subPath: ports.conf
              readOnly: true
            - name: apache-config
              mountPath: /etc/apache2/sites-enabled/000-default.conf
              subPath: 000-default.conf
              readOnly: true
            - name: roundcube-var
              mountPath: /var/roundcube
            - name: apache-logs
              mountPath: /var/log/apache2
          {{- with .Values.mailDev.roundcube.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: apache-config
          configMap:
            name: {{ include "hopps.roundcubeFullname" . }}-apache
        - name: roundcube-var
          emptyDir: {}
        - name: apache-logs
          emptyDir: {}
{{- end }}
