apiVersion: v1
kind: Service
metadata:
  name: {{ include "hopps.adminFullname" . }}
  labels:
    {{- include "hopps.adminLabels" . | nindent 4 }}
spec:
  type: {{ .Values.admin.service.type }}
  ports:
    - port: {{ .Values.admin.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hopps.adminSelectorLabels" . | nindent 4 }}
