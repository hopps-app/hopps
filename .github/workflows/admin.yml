name: admin

on:
  push:
    paths:
      - frontend/admin/**
      - frontend/api-client/**
      - .github/workflows/admin.yml
    branches: [ "**" ]
    tags:
      - 'admin-*.*.*'
  pull_request:
    paths:
      - frontend/admin/**
      - frontend/api-client/**
      - .github/workflows/admin.yml
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install PNPM
        run: npm install -g pnpm@10.29.3

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Build api-client
        run: pnpm run build
        working-directory: frontend/api-client

      - name: Run tests
        run: pnpm run validate
        working-directory: frontend/admin

      # The VITE_* placeholders are baked into the bundle here and swapped for real values at
      # container start by docker/replaceEnvs.sh, so one image works across environments.
      - name: Build project
        run: pnpm run build
        working-directory: frontend/admin
        env:
          VITE_KEYCLOAK_URL: "VITE_KEYCLOAK_URL_VALUE"
          VITE_KEYCLOAK_REALM: "VITE_KEYCLOAK_REALM_VALUE"
          VITE_KEYCLOAK_CLIENT_ID: "VITE_KEYCLOAK_CLIENT_ID_VALUE"
          VITE_API_ORG_URL: "VITE_API_ORG_URL_VALUE"
          VITE_SPA_URL: "VITE_SPA_URL_VALUE"
          VITE_ADMIN_REALM_ROLE: "VITE_ADMIN_REALM_ROLE_VALUE"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: frontend/admin/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker image tag
        id: get-version
        run: |
          if git describe --tags --exact-match 2>/dev/null; then
            TAG=$(git describe --tags --exact-match)
            echo "VERSION=${TAG#admin-}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: frontend/admin
          file: frontend/admin/docker/Dockerfile
          push: ${{ !startsWith(github.ref, 'refs/heads/dependabot') }}
          tags: ghcr.io/${{ github.repository }}/admin:${{ env.VERSION }}

      - name: Trigger deploy workflow
        uses: actions/github-script@v9
        # only trigger deployment on main
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github-token: ${{ secrets.TECHNICAL_USER_PAT }}
          script: |
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: 'hopps-app',
              repo: 'hopps.cloud',
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                "environment": "dev",
                "new-tag": "${{ env.VERSION }}",
                "service-name": "admin"
              }
            })
            console.log(result);
