name: release

# Keeps a "chore(main): release x.y.z" PR open that collects the changelog from the conventional commit titles on main.
# Merging that PR creates the vX.Y.Z tag and the GitHub release, then builds every image with that version.
#
# Alongside the changelog, Claude drafts upgrade notes for operators (config, migrations, deployment) as a comment on
# the release PR (upgrade-notes.yml, started from here). That comment can be edited before merging; on release its text
# is put at the top of the release notes.

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  # to start the image workflows for the new tag
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so start them explicitly on the tag.
      # They derive the image version from the tag, exactly as on a manually pushed vX.Y.Z tag.
      - name: Build images for ${{ needs.release-please.outputs.tag_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          for workflow in backend.yml frontend.yml admin.yml keycloak.yml; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          done

  draft-upgrade-notes:
    needs: release-please
    if: needs.release-please.outputs.pr && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    steps:
      # claude-code-action does not run on push events, so the notes are drafted in a workflow of their own
      - name: Start upgrade-notes.yml for the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        run: gh workflow run upgrade-notes.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f pr="$PR_NUMBER"

  publish-upgrade-notes:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Put the upgrade notes at the top of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # the merged release PR is the one that contains this commit
          PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          [ -n "$PR" ] || { echo "No release PR found for $GITHUB_SHA, leaving the release notes as they are"; exit 0; }
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- upgrade-notes:start -->")) | .body' > comment.md
          # only the part between the markers, without the explanation below it
          sed -n '/<!-- upgrade-notes:start -->/,/<!-- upgrade-notes:end -->/p' comment.md | sed '1d;$d' > notes.md
          [ -s notes.md ] || { echo "No upgrade notes on #$PR, leaving the release notes as they are"; exit 0; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > changelog.md
          { cat notes.md; echo; cat changelog.md; } > release.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release.md
