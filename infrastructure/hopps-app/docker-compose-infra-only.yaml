# Infrastructure only, for running the backend services from the IDE.
# No identity provider: in dev mode Quarkus Dev Services start Keycloak (port 8554),
# or point quarkus.oidc.auth-server-url at an external one such as the Authentik
# from docker-compose.authentik.yaml.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: hopps
      MINIO_ROOT_PASSWORD: hoppshopps

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/postgres_init.sql:ro
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

volumes:
  postgres_data:
