# Hopps - self-hosted deployment.
#
# Copy .env.example to .env and fill it in before the first start; several values
# have no sensible default and the stack will not come up without them.
#
#   docker compose up -d
#
# The browser-facing URLs (PUBLIC_*) must be reachable from the user's browser.
# Service-to-service traffic uses the compose network names and never leaves the host.
#
# This file is the core: frontend, org, zugferd and postgres. Optional parts are
# overlays, switched on through COMPOSE_FILE in .env (see .env.example):
#
#   Identity provider  Chosen by HOPPS_AUTH_PROVIDER in .env. "authentik" uses an
#                      existing Authentik, configured through the OIDC_* and
#                      AUTHENTIK_* variables; no extra file needed. "keycloak"
#                      also needs docker-compose.keycloak.yaml, which runs
#                      Hopps's own Keycloak.
#   File storage       Uploaded files go to the org_storage volume. The overlay
#                      docker-compose.s3.yaml stores them in MinIO instead.
#   Document AI        The overlay docker-compose.document-ai.yaml adds
#                      az-document-ai, which reads receipts that are not
#                      ZUGFeRD e-invoices.

services:

  # ---------------------------------------------------------------- frontend --
  frontend:
    image: ghcr.io/hopps-app/hopps/frontend:${FRONTEND_TAG:-1168}
    restart: unless-stopped
    ports:
      - "${SPA_PORT:-8080}:8080"
    depends_on:
      org:
        condition: service_healthy
    environment:
      VITE_TITLE: ${VITE_TITLE:-Hopps}
      VITE_GENERAL_DATE_FORMAT: ${VITE_GENERAL_DATE_FORMAT:-dd.MM.yyyy}
      VITE_GENERAL_CURRENCY_SYMBOL_AFTER: ${VITE_GENERAL_CURRENCY_SYMBOL_AFTER:-€}
      VITE_ALPHA_VERSION: ${VITE_ALPHA_VERSION:-false}
      VITE_API_ORG_URL: ${PUBLIC_ORG_URL}
      # -- login at the external OIDC provider (the browser talks to it directly)
      VITE_OIDC_PROVIDER_URL: ${PUBLIC_OIDC_ISSUER_URL:-}
      VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      # Impressum / Datenschutzerklärung. Either link an external page here, or
      # mount your own content via the volume below. See legal/README.md.
      HOPPS_IMPRINT_URL: ${HOPPS_IMPRINT_URL:-}
      HOPPS_PRIVACY_URL: ${HOPPS_PRIVACY_URL:-}
    # Uncomment to serve your own Impressum/Datenschutz content (impressum.html,
    # datenschutz.html, ... in ./legal). A mounted file is ignored for a page
    # whose *_URL above is set.
    #volumes:
    #  - ./legal:/app/legal:ro

  # ---------------------------------------------------------------- backend ---
  org:
    image: ghcr.io/hopps-app/hopps/org:${TAG:-967}
    restart: unless-stopped
    ports:
      - "${ORG_PORT:-8101}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # -- database
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/org

      # -- authentication against the external OIDC provider
      # Discovery may use an address only the container can reach (OIDC_INTERNAL_URL);
      # the issuer inside the tokens is the public one the browser used, so it is
      # asserted separately.
      QUARKUS_OIDC_AUTH_SERVER_URL: ${OIDC_INTERNAL_URL:-${PUBLIC_OIDC_ISSUER_URL:-}}
      QUARKUS_OIDC_TOKEN_ISSUER: ${PUBLIC_OIDC_ISSUER_URL:-}
      QUARKUS_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      QUARKUS_OIDC_APPLICATION_TYPE: service
      # Who manages the member accounts, set in .env: "authentik" (an existing
      # instance, configured through the OIDC_* and AUTHENTIK_* variables) or
      # "keycloak" (Hopps's own, needs docker-compose.keycloak.yaml).
      HOPPS_AUTH_PROVIDER: ${HOPPS_AUTH_PROVIDER:?set HOPPS_AUTH_PROVIDER in .env to authentik or keycloak}
      # -- Authentik only
      HOPPS_AUTHENTIK_URL: ${AUTHENTIK_URL:-}
      HOPPS_AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-}
      HOPPS_AUTHENTIK_EMAIL_STAGE_ID: ${AUTHENTIK_EMAIL_STAGE_ID:-}

      # -- the SPA is served from a different origin than the API
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: ${PUBLIC_SPA_URL}

      # -- uploaded files (receipts, logos, bank import files) on a local volume.
      # Works with a single org container only: the directory is not shared.
      HOPPS_STORAGE_TYPE: local
      HOPPS_STORAGE_LOCAL_ROOT: /var/lib/hopps/storage

      # -- e-invoice reader. Other receipts are marked for manual entry unless
      # docker-compose.document-ai.yaml is enabled.
      HOPPS_ZUGFERD_SERVICE_URL: http://zugferd:8080
    # Back this volume up together with postgres_data.
    volumes:
      - org_storage:/var/lib/hopps/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  zugferd:
    image: ghcr.io/hopps-app/hopps/zugferd:${TAG:-967}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # Optional: suggests tags for e-invoices.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ------------------------------------------------------------ persistence --
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/postgres_init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  org_storage:
